name: PR Telegram Notification

on:
  pull_request:
    types: [opened, reopened]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Message
        uses: Salmansha08/telegram-github-action@main
        with:
          to: -1004350332359
          message_thread_id: 2
          token: '8882525010:AAGzv33_Rmxh99-HlNnZRq3zGtu8mQUKvck'
          format: markdown
          message: |
            🚀 **Новый Pull Request!**
            
            👤 **Автор:** ${{ github.actor }}
            📝 **Название:** ${{ github.event.pull_request.title }}
            🔗 **Ссылка:** ${{ github.event.pull_request.html_url }}
